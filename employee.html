<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="welcome-message">Welcome, Employee!</h1>
        <p id="current-status">Status: Loading...</p>
        
        <div class="attendance-buttons">
            <button id="check-in-btn" onclick="checkIn()">Check In</button>
            <button id="check-out-btn" onclick="checkOut()">Check Out</button>
        </div>

        <h2>Your Recent Attendance</h2>
        <table id="attendance-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Check In</th>
                    <th>Check Out</th>
                    <th>Total Hours</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>

        <button onclick="logout()" class="logout-btn">Logout</button>
    </div>

    <script src="script.js"></script>
    <script>
        // Initialize the employee page on load
        document.addEventListener('DOMContentLoaded', initializeEmployeeDashboard);
    </script>
</body>
</html>
