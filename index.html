<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance System Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Welcome to the Attendance Systems</h1>
        
        <div class="login-box">
            <h2>Employee Login</h2>
            <input type="text" id="employee-id-input" placeholder="Enter Your ID (e.g., E101)">
            <button onclick="employeeLogin()">Login as Employee</button>
        </div>

        <hr>

        <div class="login-box">
            <h2>Admin Login</h2>
            <input type="password" id="admin-password-input" placeholder="Enter Admin Password">
            <button onclick="adminLogin()">Login as Admin</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
